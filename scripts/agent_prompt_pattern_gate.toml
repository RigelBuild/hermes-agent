  "**/AGENTS.md",
]
exclude_globs = [
  "**/node_modules/**",
  # Vendored upstream docs (generated from each project's docs site). Edits here conflict on
  # every upstream sync, so the gate leaves them alone.
  "optional-skills/mlops/training/**",
  "optional-skills/mlops/pytorch-fsdp/references/**",
]

pattern = "(?i)reasoning|chain of thought|chain-of-thought|thinking process|your thought process|explain (your|how you)|walk (me )?through (your|how)|show your work|step[- ]by[- ]step|think (out loud|aloud)|internal monologue|scratchpad"

