# Config for scripts/agent_prompt_pattern_gate.py (RIG-10290).
#
# globs: repo-relative patterns of agent-facing prompt text. Each file is scanned line by line.
# exclude_globs: paths dropped after globbing.
# pattern: a case-insensitive regex. A line that matches it is a finding.
# config_keys: regexes blanked out of a line before `pattern` runs, so config terms such as
#   `reasoning_effort: high` or `--reasoning max` are not flagged.
# exceptions: exact `path:line` strings allowed through. Keep each one to a real, reviewed hit.

globs = [
  "skills/**/SKILL.md",
  "optional-skills/**/SKILL.md",
  "plugins/**/SKILL.md",
