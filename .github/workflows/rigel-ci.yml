name: Rigel CI

# Branch-protection gate producing a check-run literally named `CI` for the
# fork's `main` ruleset to pin (RIG-2213). Upstream's `ci.yml` aggregator
# (`all-checks-pass`) cannot go green on this fork: its Python test suite has a
# test-isolation defect (tests/hermes_cli/test_models.py patches only the
# OpenRouter /v1/models request, not the catalog-manifest fetch, which succeeds
# on GitHub-hosted egress and returns a list that disagrees with the static
# snapshot) — so a `needs:`-aggregator over it stays red here. This standalone
# job runs the same blocking lint upstream's lint.yml runs (`ruff check .`,
# ruff pinned to the pyproject `dev` version) on a GitHub-hosted runner: a
# real, self-contained gate under our control that can go green on this fork.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - run: uv tool install ruff==0.15.10
      - run: ruff check .
