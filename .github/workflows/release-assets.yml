name: release-assets

# Builds signed Nix cache assets on free GitHub-hosted runners.
# Each narinfo points to a root-level NAR asset in the release.

on:
  push:
    tags: ["v*-rigel.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v*-rigel.* tag to build assets for.
        required: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs_on: ubuntu-24.04
            system: x86_64-linux
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
            system: aarch64-linux
          - platform: darwin-arm64
            runs_on: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build default package
        id: build
        run: |
          set -euo pipefail
          out="$(nix build .#default --no-link --print-out-paths --print-build-logs)"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Export closure as a signed binary cache
        env:
          OUT: ${{ steps.build.outputs.out }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NIX_RELEASE_SIGNING_KEY: ${{ secrets.NIX_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NIX_RELEASE_SIGNING_KEY" ]]; then
            echo "::error::Repository secret NIX_RELEASE_SIGNING_KEY is empty" >&2
            exit 1
          fi
          cache="$RUNNER_TEMP/cache"
          dist="$RUNNER_TEMP/dist"
          signing_key="$RUNNER_TEMP/nix-release-signing-key"
          mkdir -p "$cache" "$dist"
          printf '%s' "$NIX_RELEASE_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          trap 'rm -f "$signing_key"' EXIT
          nix store sign --recursive --key-file "$signing_key" "$OUT"
          nix copy --to "file://$cache" "$OUT"
          name="hermes-agent-${TAG}-${PLATFORM}"
          cp "$cache/nix-cache-info" "$dist/nix-cache-info"
          for narinfo in "$cache"/*.narinfo; do
            sed 's|^URL: nar/|URL: |' "$narinfo" > "$dist/$(basename "$narinfo")"
          done
          cp "$cache"/nar/* "$dist/"
          nix path-info --json "$OUT" > "$dist/$name.path-info.json"
          printf '%s' "$NIX_RELEASE_SIGNING_KEY" | nix key convert-secret-to-public > "$dist/nix-release-cache.pub"
          printf '%s\n' "$name" > "$dist/platform"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets to release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
      - name: Assemble binary cache root
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for platform in dist/*; do
            name=$(cat "$platform/platform")
            for metadata in nix-cache-info nix-release-cache.pub; do
              asset="release-assets/$metadata"
              if [[ -e "$asset" ]]; then
                if ! cmp -s "$platform/$metadata" "$asset"; then
                  echo "::error::Conflicting release asset $metadata" >&2
                  exit 1
                fi
              else
                cp "$platform/$metadata" "$asset"
              fi
            done
            cp "$platform/$name.path-info.json" "release-assets/$name.path-info.json"
            for file in "$platform"/*.narinfo "$platform"/*.nar; do
              asset="release-assets/$(basename "$file")"
              if [[ -e "$asset" ]]; then
                if ! cmp -s "$file" "$asset"; then
                  echo "::error::Conflicting release asset $(basename "$file")" >&2
                  exit 1
                fi
              else
                cp "$file" "$asset"
              fi
            done
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "hermes-agent $TAG"
          gh release upload "$TAG" release-assets/* --clobber

