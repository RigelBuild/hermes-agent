name: release-assets

# Builds the hermes-agent closure for each platform on free GitHub-hosted
# runners and attaches it to the GitHub Release for a v*-rigel.* tag. No
# Blacksmith and no org-funded runner: this fork is public (RIG-9275, option A).
#
# Each asset is a Nix binary-cache directory of the closure (narinfo + nar),
# packed as one .tar.xz per platform, with a .sha256 sidecar. The fork flake
# pins the sidecar hash and imports the closure (RIG-9265, pending RIG-9429).

on:
  push:
    tags: ["v*-rigel.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v*-rigel.* tag to build assets for.
        required: true

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs_on: ubuntu-24.04
            system: x86_64-linux
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
            system: aarch64-linux
          - platform: darwin-arm64
            runs_on: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build default package
        id: build
        run: |
          set -euo pipefail
          out="$(nix build .#default --no-link --print-out-paths --print-build-logs)"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Export closure as a binary cache
        env:
          OUT: ${{ steps.build.outputs.out }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/cache"
          mkdir -p "$cache"
          nix copy --to "file://$cache" "$OUT"
          name="hermes-agent-${TAG}-${PLATFORM}"
          mkdir -p "$RUNNER_TEMP/dist"
          tar -C "$cache" -cJf "$RUNNER_TEMP/dist/$name.tar.xz" .
          (cd "$RUNNER_TEMP/dist" && sha256sum "$name.tar.xz" > "$name.tar.xz.sha256")
          # Record the store path and its NAR hash so the flake pin can be checked.
          nix path-info --json "$OUT" > "$RUNNER_TEMP/dist/$name.path-info.json"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-agent-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets to release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release if missing
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "hermes-agent $TAG"

      - name: Upload assets
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
